# SPDX-License-Identifier: MIT
name: ci
on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Nightly, to drive the fuzz tier (see fuzz-nightly below).
    - cron: '0 7 * * *'
  # Reusable so release.yml can require the full suite at the tagged
  # commit (a tag push does not match the branches filter above, so the
  # matrix would otherwise never run for a release).
  workflow_call:
jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        cc: [gcc, clang]
        flags: ["", "--enable-asan --enable-ubsan", "--enable-tsan"]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y autoconf automake libtool pkg-config mandoc texinfo
      - run: ./bootstrap
      # -Werror: AGENTS.md section 7 requires zero warnings under gcc and
      # clang.  The tree is clean under both, so a new warning fails CI.
      - run: mkdir build && cd build && CC=${{ matrix.cc }} ../configure --enable-debug ${{ matrix.flags }} CFLAGS="-Werror"
      - run: make -C build -j"$(nproc)"
      - run: make -C build check -j"$(nproc)" || (find build -name '*.log' -path '*tests*' -exec tail -40 {} + ; exit 1)

  # musl: a second libc, to catch glibc-only assumptions.  PLAN section 13
  # names musl in the 1.0 bar.
  musl:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y musl-tools autoconf automake libtool pkg-config mandoc texinfo
      - run: ./bootstrap
      - run: mkdir build && cd build && CC=musl-gcc ../configure --enable-debug
      - run: make -C build -j"$(nproc)"
      - run: make -C build check -j"$(nproc)" || (find build -name '*.log' -path '*tests*' -exec tail -40 {} + ; exit 1)
      - run: make -C build distcheck -j"$(nproc)" DISTCHECK_CONFIGURE_FLAGS="CC=musl-gcc"

  # macOS: clang on Darwin, Apple ld64 (exported-symbols list instead of
  # a version script), no futex, no MSG_NOSIGNAL.  PLAN section 13.
  # Homebrew's texinfo is keg-only, so put its makeinfo on PATH.
  macos:
    runs-on: macos-latest
    # Without timeout(1) the dist scripts cannot bound a hang themselves.
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - run: brew install autoconf automake libtool pkg-config mandoc texinfo
      - run: echo "$(brew --prefix texinfo)/bin" >> "$GITHUB_PATH"
      - run: ./bootstrap
      - run: mkdir build && cd build && ../configure --enable-debug
      - run: make -C build -j"$(sysctl -n hw.ncpu)"
      - run: make -C build check -j"$(sysctl -n hw.ncpu)" || (find build -name '*.log' -path '*tests*' -exec tail -40 {} + ; exit 1)
      - run: make -C build distcheck -j"$(sysctl -n hw.ncpu)"

  # FreeBSD: a BSD userland and clang, in a VM.  PLAN section 13.
  freebsd:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Build and test in a FreeBSD VM
        uses: vmactions/freebsd-vm@v1
        with:
          usesh: true
          prepare: pkg install -y autoconf automake libtool pkgconf mandoc gmake texinfo
          run: |
            ./bootstrap
            mkdir build && cd build
            ../configure --enable-debug
            gmake -j"$(sysctl -n hw.ncpu)"
            gmake check -j"$(sysctl -n hw.ncpu)" || (find . -name '*.log' -path '*tests*' -exec tail -40 {} + ; exit 1)

  # Property tests with the hegel engine wired in, so the PBT suites run
  # real generated cases instead of reporting SKIP.  hegel is not
  # packaged, so this job is a no-op unless the repo defines a HEGEL_URL
  # variable pointing at a hegel source tree; without it the gcc/clang
  # jobs still build and run the PBT suites (in SKIP mode).
  hegel:
    if: vars.HEGEL_URL != ''
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y autoconf automake libtool pkg-config mandoc texinfo
      - name: Build hegel
        run: git clone --depth 1 "${{ vars.HEGEL_URL }}" /tmp/hegel && make -C /tmp/hegel install PREFIX=/usr/local
      - run: ./bootstrap
      - run: mkdir build && cd build && ../configure --enable-debug --with-hegel=/usr/local PKG_CONFIG_PATH=/usr/local/lib/pkgconfig
      - run: make -C build -j"$(nproc)"
      - run: make -C build check -j"$(nproc)" || (find build -name '*.log' -path '*tests*' -exec tail -40 {} + ; exit 1)

  valgrind:
    # Memcheck over a fast subset: the base and progress unit tests, which
    # exercise the allocator, antichains, and the progress core without
    # the long trace/reduce sweeps that make valgrind impractical.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y autoconf automake libtool pkg-config mandoc texinfo valgrind
      - run: ./bootstrap
      - run: mkdir build && cd build && ../configure --enable-debug
      - run: make -C build -j"$(nproc)"
      - name: Memcheck a fast subset
        working-directory: build
        run: |
          set -e
          for t in tests/unit/test_base tests/unit/test_antichain tests/unit/test_reachability; do
            test -x "$t" || make "$t" -j"$(nproc)"
            top_srcdir="$PWD/.." valgrind --error-exitcode=1 --leak-check=full --errors-for-leak-kinds=definite "$t"
          done

  distcheck:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y autoconf automake libtool pkg-config mandoc texinfo
      - run: ./bootstrap && mkdir build && cd build && ../configure && make distcheck -j"$(nproc)"

  # Nightly fuzz tier: re-run the whole suite under ASan+UBSan on a
  # schedule, and (when hegel is available) drive the PBT suites at a
  # high case count.  The per-push matrix runs the suite at the default
  # count; this is the long soak.  Guarded so it runs only on schedule or
  # manual dispatch.
  fuzz-nightly:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y autoconf automake libtool pkg-config mandoc texinfo
      - run: ./bootstrap
      - run: mkdir build && cd build && ../configure --enable-asan --enable-ubsan
      - run: make -C build -j"$(nproc)"
      - name: Full suite under ASan, PBT at an elevated case count
        working-directory: build
        env:
          DTFL_PBT_CASES: "100000"
        run: make check -j"$(nproc)" || (find . -name '*.log' -path '*tests*' -exec tail -40 {} + ; exit 1)
      # The libFuzzer tier (PLAN section 6 item 8): every target replays
      # its committed corpus, then fuzzes for DTFL_FUZZ_SECONDS.
      - run: sudo apt-get install -y clang
      - run: mkdir fuzzbuild && cd fuzzbuild && ../configure CC=clang --enable-fuzz CFLAGS="-O1 -g"
      - name: make fuzz
        working-directory: fuzzbuild
        env:
          DTFL_FUZZ_SECONDS: "300"
        run: make -j"$(nproc)" && DTFL_FUZZ_JOBS="$(nproc)" make fuzz
