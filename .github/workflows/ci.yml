name: ci
on:
  pull_request:
jobs:
  probe:
    runs-on: macos-15
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - run: brew install autoconf automake libtool pkg-config mandoc texinfo
      - run: echo "$(brew --prefix texinfo)/bin" >> "$GITHUB_PATH"
      - run: sw_vers; clang --version; uname -a
      - name: sigaltstack after fork
        run: |
          clang -o alt0 .github/probe/alt.c && ./alt0
          clang -fsanitize=address -o alt1 .github/probe/alt.c && ./alt1
          ASAN_OPTIONS=use_sigaltstack=0 ./alt1
      - run: ./bootstrap
      - run: mkdir build && cd build && ../configure --enable-debug --enable-asan --enable-ubsan
      - run: make -C build -j"$(sysctl -n hw.ncpu)"
      - run: make -C build -j"$(sysctl -n hw.ncpu)" tests/unit/test_ddir tests/unit/test_execute_worker
      - name: test_ddir 20 times, default and use_sigaltstack=0
        working-directory: build
        run: |
          export top_srcdir=$PWD/..
          for o in "" "use_sigaltstack=0"; do
            f=0
            for i in $(seq 20); do ASAN_OPTIONS=$o ./tests/unit/test_ddir > o.txt 2>&1 || { f=$((f+1)); grep -c 'CHECK failed' o.txt; }; done
            echo "ASAN_OPTIONS='$o': $f of 20 runs failed"
          done
